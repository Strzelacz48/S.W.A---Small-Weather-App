{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Contacts Manager{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'contacts/favicon.svg' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-slate-800 text-white px-6 py-4">
        <h1 class="text-xl font-semibold">Contacts Manager</h1>
    </header>

    <main class="{% block container_class %}max-w-5xl{% endblock %} mx-auto p-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
